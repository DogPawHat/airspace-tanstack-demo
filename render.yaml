# Render blueprint: deploys both apps of this monorepo on the free tier.
# Create with:  render blueprint launch  (or git-connect the repo in the Render UI)
#
# The PDS is intentionally EPHEMERAL: free web services have no persistent disk,
# so every deploy/restart/spin-down wipes all repos and blobs — this demo treats
# that as a feature (same spirit as the upstream demo's daily account wipe).
# Consequences handled here:
#   - no `disk:` mount; no reset cron (nothing accumulates)
#   - accounts are re-created after each boot with `pnpm pds:account` against the
#     deployed PDS; keep AIRSPACE_IDENTIFIER/PASSWORD stable so the web app's
#     env vars never need to change
#   - PDS_HOSTNAME is baked into each account's did:plc genesis *at account
#     creation*, not first boot — with wiping it is now safe to change later
#
# Recommended: add a CUSTOM wildcard domain to the pds service (free on Render):
#   pds.<yourdomain>.com        + wildcard *.demo.<yourdomain>.com
# Then PDS_HOSTNAME=pds.<yourdomain>.com and PDS_SERVICE_HANDLE_DOMAINS=.demo.<yourdomain>.com
# make every issued handle (alice.demo.<yourdomain>.com) resolvable by any
# atproto client. On the bare *.onrender.com domain handles stay unresolvable
# outside the PDS (you cannot add DNS under onrender.com).

services:
  # ── TanStack Start app (node runtime, no Netlify plugin) ──────────────────
  - type: web
    name: airspace-web
    runtime: node
    rootDir: apps/web
    buildCommand: pnpm install && pnpm build
    startCommand: node server.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: AIRSPACE_SERVICE
        sync: false
      - key: AIRSPACE_IDENTIFIER
        sync: false
      - key: AIRSPACE_PASSWORD
        sync: false

  # ── atproto PDS (spaces alpha) on a persistent volume ─────────────────────
  - type: web
    name: airspace-demo-pds
    runtime: docker
    dockerfilePath: apps/demo-pds/Dockerfile
    dockerContext: .
    healthCheckPath: /xrpc/_health
    autoDeploy: true
    envVars:
      # Secrets: set these once in the Render dashboard (openssl rand --hex 32,
      # or --hex 16 for PDS_ADMIN_PASSWORD). `generateValue` also works.
      - key: PDS_ADMIN_PASSWORD
        sync: false
      - key: PDS_JWT_SECRET
        sync: false
      - key: PDS_DPOP_SECRET
        sync: false
      - key: PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX
        sync: false

      - key: PDS_HOSTNAME
        sync: false        # e.g. pds.demo.yourdomain.com — do not change post-deploy
      - key: PDS_SERVICE_HANDLE_DOMAINS
        value: '.demo.getair.space'   # move to '.demo.<yourdomain>' if you rebrand
      - key: PDS_DID_PLC_URL
        value: 'https://plc.directory'
      - key: PDS_DATA_DIRECTORY
        value: '/data'
      - key: PDS_BLOBSTORE_DISK_LOCATION
        value: '/data/blobs'
      - key: PDS_INVITE_REQUIRED
        value: '1'
      - key: PDS_BLOB_UPLOAD_LIMIT
        value: '1000000'
      - key: PDS_ACCEPTING_REPO_IMPORTS
        value: '0'
      - key: PDS_PORT
        value: '3000'
      - key: PDS_SERVICE_NAME
        value: 'airspace demo'
      - key: PDS_HOME_URL
        sync: false        # e.g. https://<your-airspace-web>.onrender.com
      - key: LOG_ENABLED
        value: '1'
      - key: LOG_LEVEL
        value: 'info'

# NOTE: the Fly-style daily `reset.mjs` cron job is intentionally omitted —
# with no persistent disk there is nothing to clean up. If you ever move the
# PDS to paid compute with a disk, re-add it:
#   - type: cron ... startCommand: node reset.mjs  (apps/demo-pds/reset.mjs)
